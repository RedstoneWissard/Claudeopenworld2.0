  if(d<30&&sp<6&&!(cur&&cur.d.fly&&cur.y>3)){pay(job.pay+(job.t>job.d0/28?Math.round(job.pay*.2):0),'Auftrag erledigt');job=null;ep=0}else if(job.t<=0){pay(-100,'Auftrag verfehlt');job=null;ep=0}}
 if(cur){const d=cur.d,cap=d.l*18;if(cur.fuel==null)cur.fuel=cap*(.4+Math.random()*.6);cur.fuel=Math.max(0,cur.fuel-Math.abs(cur.sp)*dt*(.0006+d.l*.00005)*(d.fly?3:1));if(cur.fuel<=0&&d.plane)cur.thr=0;
  if(Math.abs(cur.sp)<2&&cur.y<2&&cur.fuel<cap&&money>2&&GS.some(g=>Math.hypot(g[0]-cur.x,g[1]-cur.z)<18)){const l=Math.min(cap-cur.fuel,15*dt,money/2);cur.fuel+=l;money-=l*2;if((ec+=dt)>3){ec=0;save()}}
  if(!d.fly&&T0-lastFine>6){const sp=Math.abs(cur.sp),ax=Math.abs(Math.sin(cur.h))>.7?0:1;
   if(sp>4)for(const c of LG)if(Math.abs(c[0]-cur.x)<7&&Math.abs(c[1]-cur.z)<7&&lc(ax)==2){lastFine=T0;pay(-200,'Rote Ampel');break}
   if(T0-lastFine>6&&sp>19&&places.some(p=>!p.ap&&Math.hypot(p.x-cur.x,p.z-cur.z)<p.r*.8)){lastFine=T0;pay(-150,'Zu schnell im Ort')}}}
 if(rail&&rm=='drv'){const r=rail,i=r.stops.findIndex(x=>Math.abs(x.s+r.dir*r.L/2-r.s)<12);if(r.v<.8&&i>=0&&r.paid!==i){r.paid=i;pay(r.kind=='ice'?600:r.kind=='tram'?80:200,'Halt '+r.stops[i].n)}if(r.v>2)r.paid=-1}
 if(!mn.hidden)mny.textContent=mny.textContent.startsWith('Zu wenig')?mny.textContent:'Kontostand: '+fmt(money);else mny.textContent=''}

const NET={on:0,code:'',id:Math.random().toString(36).slice(2,8),nm:'Spieler',g:null,pc:null,conns:{},up:null,host:0,mode:''},remotes={},$=id=>document.getElementById(id);
function mkMan(c){const g=new THREE.Group();box(.6,1,.35,c,0,1.1,0,g);box(.35,.35,.35,0xf5cba7,0,1.8,0,g);box(.5,.7,.3,0x2c3e50,0,.35,0,g);S.add(g);return g}
function mkLabel(t){const c=document.createElement('canvas');c.width=256;c.height=64;const g=c.getContext('2d');g.font='bold 34px sans-serif';g.textAlign='center';g.lineWidth=6;g.strokeStyle='#000';g.strokeText(t,128,44);g.fillStyle='#fff';g.fillText(t,128,44);
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false,fog:false}));s.scale.set(6,1.5,1);s.position.y=4.5;s.renderOrder=9;return s}
function dropRemote(id){const r=remotes[id];if(r){if(r.g)S.remove(r.g);delete remotes[id]}}
function applyState(m,pid){if(!m||typeof m!='object')return;const id=pid||m.id;if(!id||id==NET.id)return;const nm=String(m.n||'Spieler').slice(0,14),c=m.c|0,t=VT[m.t]?m.t:'walk';let r=remotes[id];
 if(!r)r=remotes[id]={x:+m.x||0,z:+m.z||0,y:+m.y||0,h:+m.h||0,g:null};
 r.tx=+m.x||0;r.tz=+m.z||0;r.ty=+m.y||0;r.th=+m.h||0;r.seen=performance.now();
 if(!r.g||r.t!=t||r.c!=c||r.n!=nm){if(r.g)S.remove(r.g);r.t=t;r.c=c;r.n=nm;r.rot=null;
  if(t=='walk')r.g=mkMan(c);else{const v=mkVeh(t,0,0,0,c);vehs.splice(vehs.indexOf(v),1);r.g=v.g;r.rot=v.rot}
  r.g.add(mkLabel(nm))}}
function updRemotes(dt){const now=performance.now(),k=Math.min(1,8*dt);for(const id in remotes){const r=remotes[id];if(NET.mode!='room'&&now-r.seen>6000){dropRemote(id);continue}
 r.x+=(r.tx-r.x)*k;r.z+=(r.tz-r.z)*k;r.y+=(r.ty-r.y)*k;const df=((r.th-r.h+Math.PI*3)%(Math.PI*2))-Math.PI;r.h+=df*k;
 if(r.g){r.g.position.set(r.x,r.y,r.z);r.g.rotation.y=r.h;if(r.rot)r.rot.rotation.y+=dt*30}}}
function netSend(m){if(NET.mode=='room'&&NET.g)NET.g.presence({s:m}).catch(()=>{});
 else if(NET.host){for(const k in NET.conns)if(NET.conns[k].open)NET.conns[k].send(m)}else if(NET.up&&NET.up.open)NET.up.send(m)}
setInterval(()=>{if(!NET.on)return;const t=cur||P;netSend({id:NET.id,x:+t.x.toFixed(1),z:+t.z.toFixed(1),y:+(t.y||0).toFixed(1),h:+t.h.toFixed(2),t:cur?cur.t:'walk',c:cur?cur.pm.color.getHex():0x3498db,n:NET.nm})},100);
function netLeave(){if(NET.g){NET.g.leave().catch(()=>{});NET.g=null}if(NET.pc){NET.pc.destroy();NET.pc=null}NET.conns={};NET.up=null;NET.on=0;NET.mode='';for(const id in remotes)dropRemote(id)}
function pjStart(code,host){return new Promise((ok,no)=>{if(typeof Peer=='undefined')return no('PeerJS konnte nicht geladen werden.');
 const p=new Peer(host?'frl-'+code:undefined),to=setTimeout(()=>no('Zeitüberschreitung'),12000);NET.pc=p;
 p.on('error',e=>{clearTimeout(to);no(e.type=='unavailable-id'?'Code bereits vergeben':e.type=='peer-unavailable'?'Lobby nicht gefunden':(e.type=='network'||e.type=='server-error'||e.type=='socket-error'||e.type=='socket-closed')?'PeerJS-Server nicht erreichbar':e.type)});
 p.on('open',()=>{if(host){clearTimeout(to);ok()}else{const c=p.connect('frl-'+code,{serialization:'json'});NET.up=c;c.on('open',()=>{clearTimeout(to);ok()});c.on('data',m=>applyState(m))}});
 if(host)p.on('connection',c=>{NET.conns[c.peer]=c;c.on('data',m=>{applyState(m);for(const k in NET.conns)if(k!=c.peer&&NET.conns[k].open)NET.conns[k].send(m)});c.on('close',()=>delete NET.conns[c.peer])})})}
async function netJoin(code,host){const st=$('ms');st.textContent='Verbinde …';
 try{netLeave();NET.nm=($('nm').value||'Spieler').slice(0,14);NET.code=code;
  if(typeof claude!='undefined'&&claude.use){const rm=await claude.use('room');if(!rm)throw 'Multiplayer ist hier nicht verfügbar: nur für angemeldete Personen mit Zugriff auf diese Seite (nicht über einen öffentlichen Link).';
   const g=await rm.join('frl-'+code.toLowerCase());NET.g=g;NET.mode='room';
   g.onPeers(ch=>{ch.peers.forEach(p=>{if(!p.sameTab&&p.presence&&p.presence.s)applyState(p.presence.s,p.peer)});ch.left.forEach(p=>dropRemote(p.peer))})}
  else{await pjStart(code,host);NET.mode='pj';NET.host=host}
  NET.on=1;st.textContent='Lobby-Code: '+code+' – andere geben diesen Code unter „Beitreten“ ein.'}
 catch(e){netLeave();st.textContent='Fehler: '+(e.message||e)}}

function fitModel(src,d,fl){const sc=(THREE.SkeletonUtils?THREE.SkeletonUtils.clone(src):src.clone(true)),rm=[];sc.traverse(o=>{if(o!==sc&&/ground|floor|plane|shadow|backdrop|collision|camera/i.test(o.name||''))rm.push(o)});rm.forEach(o=>o.parent&&o.parent.remove(o));const b0=new THREE.Box3().setFromObject(sc),s0=b0.getSize(new THREE.Vector3()),a=new THREE.Group();a.add(sc);sc.position.sub(b0.getCenter(new THREE.Vector3()));
 a.rotation.y=(s0.x>s0.z?Math.PI/2:0)+(fl?Math.PI:0);a.updateMatrixWorld(true);
 const s1=new THREE.Box3().setFromObject(a).getSize(new THREE.Vector3());a.scale.setScalar(d.l/s1.z);a.updateMatrixWorld(true);
 const b=new THREE.Box3().setFromObject(a);a.position.y-=b.min.y;const f=new THREE.Group();f.add(a);return f}
function getModel(t){if(MODELS[t])return MODELS[t];const s=RAW[t]?t:FALL[t];if(!RAW[s])return null;return MODELS[t]=fitModel(RAW[s],VT[t],FL.includes(s)||FL.includes(t))}
function useModel(v){const m=getModel(v.t);if(!m||v.src===m)return;v.src=m;if(v.mc)v.g.remove(v.mc);else{v.proc.forEach(o=>v.g.remove(o));v.rot=null}const c=THREE.SkeletonUtils?THREE.SkeletonUtils.clone(m):m.clone(true);v.mc=c;v.pms=[];
 c.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=true;if(o.material)o.material.envMapIntensity=.7;if(o.material&&/body|paint|lack|karosserie/i.test(o.material.name||'')){o.material=o.material.clone();v.pms.push(o.material);if(v.col!=null)o.material.color.set(v.col)}}});v.g.add(c)}
if(THREE.GLTFLoader){const L=new THREE.GLTFLoader();
 Object.keys(VT).forEach(t=>L.load('models/'+t+'.glb',g=>{RAW[t]=g.scene;for(const k in MODELS)delete MODELS[k];vehs.forEach(v=>useModel(v))},undefined,()=>{}))}

function drawMM(){if(++mf%3)return;const t=cur||P,Z=140,sc=Z/2/250,c=Math.cos(t.h),s=Math.sin(t.h);mc.clearRect(0,0,Z,Z);mc.fillStyle='rgba(0,0,0,.5)';mc.fillRect(0,0,Z,Z);
 const dot=(x,z,col,r)=>{const dx=x-t.x,dz=z-t.z,sx=Z/2+(-dx*c+dz*s)*sc,sy=Z/2-(dx*s+dz*c)*sc;if(sx<2||sy<2||sx>Z-2||sy>Z-2)return;mc.fillStyle=col;mc.beginPath();mc.arc(sx,sy,r,0,7);mc.fill()};
 vehs.forEach(v=>{if(!v.bot)dot(v.x,v.z,'#9aa0a6',2)});vehs.forEach(v=>{if(v.bot)dot(v.x,v.z,'#ff9800',3.5)});for(const id in remotes)dot(remotes[id].x,remotes[id].z,'#4fc3f7',3.5);if(job){const dx=job.x-t.x,dz=job.z-t.z,sx=-dx*c+dz*s,sy=-(dx*s+dz*c),k=Math.min(1,(Z/2-8)/Math.max(Math.abs(sx*sc),Math.abs(sy*sc),1));mc.fillStyle='#ffeb3b';mc.beginPath();mc.arc(Z/2+sx*sc*k,Z/2+sy*sc*k,5,0,7);mc.fill()}
