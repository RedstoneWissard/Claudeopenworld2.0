<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Freiland – Open-World-Fahrspiel</title>
<style>
:root{box-sizing:border-box;color-scheme:dark}
html,body{margin:0;height:100%;background:#9cc7e8;overflow:hidden;font-family:system-ui,sans-serif;color:#fff}
canvas{position:fixed;inset:0;display:block;z-index:0;touch-action:none}
#hud{z-index:5;position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 10px);text-shadow:0 1px 3px #000;font-size:14px;line-height:1.5;pointer-events:none}
#hint{z-index:5;position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);text-align:center;text-shadow:0 1px 3px #000;font-size:15px;pointer-events:none}
#help{z-index:5;position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);text-align:right;text-shadow:0 1px 3px #000;font-size:12px;line-height:1.5;pointer-events:none;max-width:45vw}
#tc{display:none}
@media(pointer:coarse){#tc{display:block}#help{display:none}}
.g{z-index:10;position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.g b{width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;font-size:20px;user-select:none;-webkit-user-select:none;touch-action:none}
#help{top:calc(env(safe-area-inset-top,0px) + 56px)}
#mb{position:fixed;z-index:10;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;padding:8px 16px;border-radius:20px;border:2px solid rgba(255,255,255,.6);background:rgba(0,0,0,.45);color:#fff;font-size:15px}
#menu{position:fixed;inset:0;z-index:20;background:rgba(10,12,16,.88);display:flex;flex-direction:column;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 16px) 14px 18px;overflow:auto;touch-action:pan-y}
#menu[hidden]{display:none}
#menu h3{margin:4px 0;font-size:16px}
#brands,#sw{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#menu button{padding:9px 13px;border-radius:10px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;font-size:14px}
#sw button{width:38px;height:38px;padding:0;border-radius:50%}
#cp{width:48px;height:38px;border:0;background:none;padding:0}
</style></head><body>
<div id="hud"></div><div id="hint"></div>
<div id="help">WASD / Pfeile: laufen, fahren<br>Shift: sprinten, sinken<br>Leertaste: Handbremse, steigen<br>E: ein-/aussteigen<br>M: Menü</div>
<div id="tc"><div class="g" style="left:10px"><b data-k="KeyA">◀</b><b data-k="KeyD">▶</b></div>
<div class="g" style="right:10px;width:200px;justify-content:flex-end"><b data-k="Space">⇧</b><b data-k="ShiftLeft">⇩</b><b data-k="KeyS">▼</b><b data-k="KeyW">▲</b><b data-k="KeyE">E</b></div></div>
<button id="mb">Menü</button>
<div id="menu" hidden><h3>Automarke wählen</h3><div id="brands"></div><h3>Farbe</h3><div id="sw"><input type="color" id="cp" value="#c0392b"></div><button id="mc">Schließen</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const R=new THREE.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));
R.shadowMap.enabled=true;R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;document.body.appendChild(R.domElement);
const S=new THREE.Scene(),SKY=0x9cc7e8;S.background=new THREE.Color(SKY);S.fog=new THREE.Fog(SKY,160,800);
const cam=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.5,2500);
S.add(new THREE.HemisphereLight(0xdfeeff,0x5a6a48,.8));
const sun=new THREE.DirectionalLight(0xfff0d0,1.1);sun.position.set(90,140,60);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
const sc=sun.shadow.camera;sc.left=sc.bottom=-90;sc.right=sc.top=90;sc.far=400;S.add(sun,sun.target);
addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});

const rnd=(()=>{let s=11;return()=>(s=(s*16807)%2147483647)/2147483647})(),ri=(a,b)=>a+rnd()*(b-a);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.75});
function box(w,h,d,c,x,y,z,p){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),c.isMaterial?c:mat(c));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;(p||S).add(m);return m}
function canvasTex(sz,fn,rep){const c=document.createElement('canvas');c.width=c.height=sz;fn(c.getContext('2d'));const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.wrapS=t.wrapT=THREE.RepeatWrapping;if(rep)t.repeat.set(rep,rep);t.anisotropy=4;return t}

// Gelände
const gt=canvasTex(128,g=>{g.fillStyle='#5c8a3c';g.fillRect(0,0,128,128);for(let i=0;i<900;i++){g.fillStyle=`hsl(${85+rnd()*30},${35+rnd()*20}%,${28+rnd()*18}%)`;g.fillRect(rnd()*128,rnd()*128,3,3)}},600);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(4000,4000),new THREE.MeshStandardMaterial({map:gt,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;S.add(ground);
for(let i=0;i<36;i++){const a=i/36*Math.PI*2,h=ri(220,420),r=ri(220,320);const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,7),mat(i%3?0x6f7a72:0x8a8f8c));m.position.set(Math.cos(a)*1750,h/2-5,Math.sin(a)*1750);S.add(m)}

// Orte und Straßen
const places=[],roads=[],cols=[],segs=[];
const rdMat=mat(0x34373a);
function road(x1,z1,x2,z2){const m=box(Math.abs(x2-x1)||12,.1,Math.abs(z2-z1)||12,rdMat,(x1+x2)/2,.05,(z1+z2)/2);m.castShadow=false;
 roads.push([Math.min(x1,x2)-6,Math.min(z1,z2)-6,Math.max(x1,x2)+6,Math.max(z1,z2)+6]);segs.push([x1,z1,x2,z2])}
const wt=canvasTex(64,g=>{g.fillStyle='#fff';g.fillRect(0,0,64,64);g.fillStyle='#4d6b86';for(let i=0;i<2;i++)for(let j=0;j<2;j++)g.fillRect(8+i*32,10+j*32,16,18)});
const PAL=[0xd9cbb0,0xb8a898,0xc9d3d8,0xe0b9a0,0xa9b7a0,0xcfc0c8];
function bld(x,z,w,d,h,roof){const t=wt.clone();t.needsUpdate=true;t.repeat.set(Math.max(1,Math.round(w/8)),Math.max(1,Math.round(h/8)));
 box(w,h,d,new THREE.MeshStandardMaterial({color:PAL[(rnd()*PAL.length)|0],map:t,roughness:.7}),x,h/2,z);
 if(roof){const r=new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*.75,3,4),mat(0x8e3b2e));r.rotation.y=Math.PI/4;r.position.set(x,h+1.5,z);r.castShadow=true;S.add(r)}
 cols.push([x,z,w/2,d/2,h])}
function town(n,cx,cz,s,cell,slots,tall){const half=s*cell/2;places.push({n,x:cx,z:cz,r:half+80});
 for(let i=0;i<=s;i++){const o=-half+i*cell;road(cx+o,cz-half,cx+o,cz+half);road(cx-half,cz+o,cx+half,cz+o)}
 const sw=(cell-12)/slots;
 for(let i=0;i<s;i++)for(let j=0;j<s;j++)for(let a=0;a<slots;a++)for(let b=0;b<slots;b++){if(rnd()<.08)continue;
  const x=cx-half+i*cell+6+sw*(a+.5),z=cz-half+j*cell+6+sw*(b+.5),dc=Math.hypot(i-s/2+.5,j-s/2+.5)/s;
  const h=tall==0?ri(4,6):tall==1?ri(8,16):ri(10,22)+Math.max(0,1-dc*1.6)*50*rnd();
  bld(x,z,sw-4,sw-4,h,tall==0)}}
const T=[['Neustadt',0,0,6,48,2,2],['Hafenburg',800,0,4,40,1,1],['Bergheim',800,700,4,40,1,1],['Waldau',-700,-500,4,40,1,1],['Sonnental',0,-700,4,40,1,1],['Lindenberg',1300,0,4,40,1,1],['Rosenfeld',-1200,0,4,40,1,1],['Nordhafen',800,1300,4,40,1,1],['Westfeld',-700,700,4,40,1,1],['Ostwald',1300,-600,4,40,1,1],['Tannenfels',-1200,-500,4,40,1,1],['Eisenau',0,-1300,4,40,1,1],['Seeblick',-1200,700,4,40,1,1]];
const V=[['Kleindorf',400,0],['Auenbach',-350,0],['Mühlbach',800,350],['Eichwald',-700,-250],['Birkenau',0,-350],['Wiesenau',1050,0],['Hügeldorf',800,1000],['Kornfeld',1300,-300],['Fichtenbach',-950,-500],['Tiefenbrunn',0,-1000],['Lindenau',100,700],['Moosdorf',-300,700],['Weidenau',-1200,350],['Steinbach',-1000,0],['Rabenstein',400,700],['Quellental',-450,700]];
T.forEach(t=>town(...t));V.forEach(v=>town(v[0],v[1],v[2],2,30,1,0));
function link(a,b){if(a[1]!=b[1])road(a[1],a[2],b[1],a[2]);if(a[2]!=b[2])road(b[1],a[2],b[1],b[2])}
link(T[0],T[1]);link(T[1],T[2]);link(T[0],T[3]);link(T[0],T[4]);link(T[1],T[5]);link(T[0],T[6]);link(T[2],T[7]);link(T[2],T[8]);link(T[5],T[9]);link(T[3],T[10]);link(T[4],T[11]);link(T[6],T[12]);link(T[8],T[12]);
const free=(x,z)=>!roads.some(r=>x>r[0]-5&&x<r[2]+5&&z>r[1]-5&&z<r[3]+5)&&!places.some(p=>Math.hypot(x-p.x,z-p.z)<p.r);

// Bäume
const NT=1400,tr=new THREE.InstancedMesh(new THREE.CylinderGeometry(.3,.4,3,6),mat(0x5b3d26),NT),cr=new THREE.InstancedMesh(new THREE.ConeGeometry(2.2,6,7),mat(0x2f6b34),NT),dm=new THREE.Object3D();
for(let i=0,n=0;n<NT&&i<9000;i++){const x=ri(-1500,1500),z=ri(-1500,1500);if(!free(x,z))continue;const k=ri(.8,1.6);
 dm.position.set(x,1.5*k,z);dm.scale.set(k,k,k);dm.updateMatrix();tr.setMatrixAt(n,dm.matrix);
 dm.position.set(x,(3+3)*k,z);dm.updateMatrix();cr.setMatrixAt(n,dm.matrix);n++}
tr.castShadow=cr.castShadow=true;S.add(tr,cr);

// Fahrzeuge
const VT={car:{n:'Auto',c:0xc0392b,l:4.2,w:1.9,h:1,acc:20,max:42,r:1.7,t:1.6},sport:{n:'Sportwagen',c:0xf1c40f,l:4.4,w:2,h:.8,acc:34,max:72,r:1.7,t:1.9},
truck:{n:'LKW',c:0xecf0f1,l:8,w:2.6,h:2.6,acc:10,max:28,r:3,t:1.0},bike:{n:'Motorrad',c:0x2c3e50,l:2.2,w:.7,h:1,acc:30,max:55,r:1,t:2.2},
heli:{n:'Hubschrauber',c:0x2e86c1,l:6,w:2.2,h:2,acc:25,max:55,r:3,t:1.5,fly:1}};
VT.suv={n:'SUV',c:0x2e7d32,l:4.7,w:2,h:1.3,acc:18,max:40,r:1.9,t:1.5};VT.mini={n:'Kleinwagen',c:0x1e88e5,l:3.4,w:1.7,h:.95,acc:20,max:36,r:1.4,t:1.9};
const gl=new THREE.MeshStandardMaterial({color:0x1d2a36,roughness:.2,metalness:.5});
function wheel(g,x,y,z,r,w){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,w,14).rotateZ(Math.PI/2),mat(0x151515));m.position.set(x,y,z);m.castShadow=true;g.add(m)}
const vehs=[];
function mkVeh(t,x,z,h,col,nm){const d=VT[t],g=new THREE.Group(),pm=mat(col==null?d.c:col),v={g,t,d,x,z,y:0,h,sp:0,rot:null,pm,nm:nm||d.n};
 if(t=='truck'){box(d.w,2.8,d.l-3.2,0xe8e8e8,0,2,-1.6,g);box(d.w,2.6,2.4,pm,0,1.8,d.l/2-1.2,g);box(d.w*.9,1,.1,gl,0,2.4,d.l/2,g);box(d.w,.5,d.l,0x222222,0,.7,0,g);
  [-1,1].forEach(s=>[-2.6,0,2.8].forEach(zz=>wheel(g,s*d.w/2,.6,zz,.6,.4)))}
 else if(t=='bike'){box(.4,.5,1.8,pm,0,.9,0,g);box(.5,.8,.4,0xc0392b,0,1.4,-.1,g);box(.3,.3,.3,0xf5cba7,0,1.95,-.1,g);wheel(g,0,.4,.85,.4,.2);wheel(g,0,.4,-.85,.4,.2)}
 else if(t=='heli'){box(2.2,1.8,5,pm,0,1.3,0,g);box(1.8,1,1.6,gl,0,1.6,2.2,g);box(.4,.4,4,pm,0,1.8,-4,g);box(.2,1.4,.5,pm,0,2.3,-5.8,g);
  box(.15,.15,4,0x222222,-1,.15,0,g);box(.15,.15,4,0x222222,1,.15,0,g);v.rot=box(10,.08,.4,0x222222,0,2.4,0,g);v.rot.castShadow=false}
 else{box(d.w,d.h*.55,d.l,pm,0,d.h*.55,0,g);box(d.w*.85,d.h*.45,d.l*.5,gl,0,d.h*.55+d.h*.45,-d.l*.05,g);[-1,1].forEach(s=>[-1,1].forEach(q=>wheel(g,s*d.w/2,.4,q*d.l*.33,.4,.3)))}
 S.add(g);vehs.push(v);return v}
function place(t,x,z,h){return mkVeh(t,x,z,h)}
place('car',14,3,Math.PI/2);place('sport',28,-3,Math.PI/2);place('bike',40,3,Math.PI/2);place('truck',56,-3,Math.PI/2);place('heli',0,-34,0);
places.forEach(p=>{const ts=['car','sport','truck','bike','car'];for(let i=0;i<3;i++)place(ts[(rnd()*5)|0],p.x+ri(-60,60),p.z+(i%2?3:-3),i%2?Math.PI/2:-Math.PI/2)});

// Spieler
const P={x:4,z:-5,y:0,h:0,g:new THREE.Group()};
box(.6,1,.35,0x3498db,0,1.1,0,P.g);box(.35,.35,.35,0xf5cba7,0,1.8,0,P.g);box(.5,.7,.3,0x2c3e50,0,.35,0,P.g);S.add(P.g);
let cur=null;

// Eingabe
const K={};addEventListener('keydown',e=>{if(!K[e.code]&&e.code=='KeyE')act();K[e.code]=1;if(e.code=='Space')e.preventDefault()});addEventListener('keyup',e=>K[e.code]=0);addEventListener('pointerdown',()=>focus());
document.querySelectorAll('[data-k]').forEach(b=>{const c=b.dataset.k;
 b.addEventListener('pointerdown',e=>{e.preventDefault();K[c]=1;if(c=='KeyE')act()});['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,()=>K[c]=0))});
function nearest(){let b=null,bd=7;vehs.forEach(v=>{const d=Math.hypot(v.x-P.x,v.z-P.z);if(d<bd){bd=d;b=v}});return b}
function act(){if(cur){if(cur.y>3){hint('Zu hoch zum Aussteigen');return}
  P.x=cur.x-Math.cos(cur.h)*(cur.d.w/2+1.5);P.z=cur.z+Math.sin(cur.h)*(cur.d.w/2+1.5);P.h=cur.h;P.y=0;cur.sp=0;cur=null;P.g.visible=true}
 else{const v=nearest();if(v){cur=v;v.bot=0;P.g.visible=false}}}
let ht=0;function hint(t){document.getElementById('hint').textContent=t;ht=2}
function hit(o,r){let h=false;for(const c of cols){if(o.y>=c[4])continue;const dx=o.x-c[0],dz=o.z-c[1],ox=c[2]+r-Math.abs(dx),oz=c[3]+r-Math.abs(dz);
 if(ox>0&&oz>0){if(ox<oz)o.x+=Math.sign(dx||1)*ox;else o.z+=Math.sign(dz||1)*oz;h=true}}return h}

function step(dt){
 const th=(K.KeyW||K.ArrowUp?1:0)-(K.KeyS||K.ArrowDown?1:0),st=(K.KeyA||K.ArrowLeft?1:0)-(K.KeyD||K.ArrowRight?1:0),sh=K.ShiftLeft||K.ShiftRight;
 if(!cur){P.h+=st*2.6*dt;const s=th*(sh?10:5);P.x+=Math.sin(P.h)*s*dt;P.z+=Math.cos(P.h)*s*dt;hit(P,.5);
  P.g.position.set(P.x,0,P.z);P.g.rotation.y=P.h}
 else{const v=cur,d=v.d;let sp=v.sp;
  if(th>0)sp+=d.acc*dt*(1-Math.max(sp,0)/d.max*.85);
  else if(th<0)sp+=(sp>0?-38:-d.acc*.5)*dt;else sp-=sp*.6*dt;
  sp-=sp*.12*dt;if(K.Space&&!d.fly)sp-=sp*3*dt;sp=Math.max(-12,Math.min(d.max,sp));
  v.h+=st*d.t*Math.min(1,Math.abs(sp)/6)*(1-.5*Math.abs(sp)/d.max)*Math.sign(sp||1)*dt*(d.fly?1:1);
  if(d.fly){const lift=(K.Space?1:0)-(sh?1:0);v.vy=(v.vy||0)+(lift*14-(v.vy||0))*Math.min(1,3*dt);v.y=Math.max(0,v.y+v.vy*dt);if(v.y<=0)v.vy=Math.max(0,v.vy);
   if(v.y>0.2)v.h+=st*1.2*dt;else sp*=1-1.5*dt;v.rot.rotation.y+=dt*(v.y>.2||th?30:10)}
  v.x+=Math.sin(v.h)*sp*dt;v.z+=Math.cos(v.h)*sp*dt;
  if(hit({get x(){return v.x},set x(a){v.x=a},get z(){return v.z},set z(a){v.z=a},y:v.y},d.r))sp*=1-4*dt;
  v.sp=sp;v.g.position.set(v.x,v.y,v.z);v.g.rotation.y=v.h;if(d.fly)v.g.rotation.x=Math.min(.3,sp*.006);
  P.x=v.x;P.z=v.z}
 bots.forEach(b=>{if(b.bot&&b!==cur)botStep(b,dt)});
 const t=cur||P,fx=Math.sin(t.h),fz=Math.cos(t.h),fly=cur&&cur.d.fly,dist=cur?(fly?20:cur.d.l*1.8+4):6,hh=cur?(fly?7:3.6):2.8,ty=(t.y||0)+hh;
 cam.position.lerp(new THREE.Vector3(t.x-fx*dist,ty,t.z-fz*dist),1-Math.exp(-5*dt));
 cam.lookAt(t.x+fx*4,(t.y||0)+1.5,t.z+fz*4);
 const sp=cur?Math.abs(cur.sp):0;cam.fov+=(65+sp*.3-cam.fov)*Math.min(1,3*dt);cam.updateProjectionMatrix();
 sun.position.set(t.x+90,140,t.z+60);sun.target.position.set(t.x,0,t.z);
 let pl='Landstraße',bd=1e9;places.forEach(p=>{const d=Math.hypot(t.x-p.x,t.z-p.z);if(d<p.r&&d<bd){bd=d;pl=p.n}});V.forEach(v=>{if(Math.hypot(t.x-v[1],t.z-v[2])<80)pl=v[0]});
 document.getElementById('hud').innerHTML=`<b>${pl}</b><br>${cur?cur.nm+' · '+Math.round(sp*3.6)+' km/h'+(fly?' · Höhe '+Math.round(cur.y)+' m':''):'zu Fuß'}`;
 if(ht>0){ht-=dt}else{const n=cur?null:nearest();document.getElementById('hint').textContent=cur?'':(n?'E: '+n.nm+' einsteigen':'')}}
// Bots
const bots=[],BC=[0xc0392b,0x2980b9,0xecf0f1,0x222222,0xf39c12,0x27ae60,0x7f8c8d,0x8e44ad],BT=['car','car','car','sport','mini','suv','truck'];
function onSeg(s,x,z){return x>=Math.min(s[0],s[2])-1&&x<=Math.max(s[0],s[2])+1&&z>=Math.min(s[1],s[3])-1&&z<=Math.max(s[1],s[3])+1}
function setDir(v,q,dir){v.sg=q;v.dr=q[1]==q[3]?[dir,0]:[0,dir]}
for(let i=0;i<40;i++){const q=segs[i<12?(rnd()*14)|0:(rnd()*segs.length)|0],hz=q[1]==q[3],dir=rnd()<.5?-1:1;
 const a=hz?ri(Math.min(q[0],q[2]),Math.max(q[0],q[2])):q[0],b=hz?q[1]:ri(Math.min(q[1],q[3]),Math.max(q[1],q[3]));
 const v=mkVeh(BT[(rnd()*BT.length)|0],a,b,0,BC[(rnd()*BC.length)|0]);v.bot=1;v.bs=ri(11,20);v.p=[a,b];setDir(v,q,dir);v.o=[-v.dr[1]*3.2,v.dr[0]*3.2];bots.push(v)}
function botStep(v,dt){const s=v.sg,[dx,dz]=v.dr;v.p[0]+=dx*v.bs*dt;v.p[1]+=dz*v.bs*dt;
 const ex=dx>0?Math.max(s[0],s[2]):Math.min(s[0],s[2]),ez=dz>0?Math.max(s[1],s[3]):Math.min(s[1],s[3]);
 if((dx&&(v.p[0]-ex)*dx>=0)||(dz&&(v.p[1]-ez)*dz>=0)){const px=dx?ex:s[0],pz=dz?ez:s[1],o=[];
  segs.forEach(q=>{if(q!==s&&onSeg(q,px,pz))[-1,1].forEach(dir=>{const hz=q[1]==q[3];if(onSeg(q,px+(hz?dir*6:0),pz+(hz?0:dir*6)))o.push([q,dir])})});
  if(o.length){const c=o[(rnd()*o.length)|0],hz=c[0][1]==c[0][3];setDir(v,c[0],c[1]);v.p=[hz?px:c[0][0],hz?c[0][1]:pz]}
  else{v.dr=[-dx,-dz];v.p=[px,pz]}}
 const [ux,uz]=v.dr,k=Math.min(1,4*dt);v.o[0]+=(-uz*3.2-v.o[0])*k;v.o[1]+=(ux*3.2-v.o[1])*k;v.x=v.p[0]+v.o[0];v.z=v.p[1]+v.o[1];
 const ht=Math.atan2(ux,uz),df=((ht-v.h+Math.PI*3)%(Math.PI*2))-Math.PI;v.h+=df*Math.min(1,6*dt);
 v.g.position.set(v.x,0,v.z);v.g.rotation.y=v.h;
 if(cur&&cur.y<2){const ax=cur.x-v.x,az=cur.z-v.z,dd=Math.hypot(ax,az)||1,rr=cur.d.r+v.d.r;if(dd<rr){cur.x+=ax/dd*(rr-dd)*.6;cur.z+=az/dd*(rr-dd)*.6;cur.sp*=1-3*dt}}}
